services:
  mongo:
    image: mongo:8
    container_name: urx-workspace-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: urx
      MONGO_INITDB_ROOT_PASSWORD: urx
    volumes:
      - mongo_data:/data/db
    networks:
      - urx-network
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: urx-workspace-mailhog
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    networks:
      - urx-network

  smspitt:
    # Official image not on Docker Hub yet — run the npm package (see loicgeek/smspitt)
    image: node:22-bookworm-slim
    container_name: urx-workspace-smspitt
    restart: unless-stopped
    command: ['npx', '--yes', 'smspitt@0.1.0', '--no-open']
    ports:
      - '2875:2875' # Web UI (like MailHog for SMS)
      - '2876:2876' # Mock SMS API
      - '2877:2877' # Test REST API
    networks:
      - urx-network

networks:
  urx-network:
    driver: bridge

volumes:
  mongo_data:
